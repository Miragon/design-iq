# Dependabot — balanced mode: minor+patch grouped per ecosystem, each major
# lands as its own PR for individual review. The Miragon modeler families are
# the exception: one PR per family, majors included, because a renderer and
# the schema model it pins only move together. The majors of diagram-js, didi
# and tiny-svg share one PR too. Reviewers come from CODEOWNERS.
version: 2
updates:
  # npm — one block covers the whole pnpm workspace (resolved from the root).
  - package-ecosystem: "npm"
    directory: "/"
    # docs/ takes its pins from the Miragon docs kit (Miragon/corporate-identity,
    # skill docs-site), and those change only with a kit release: version
    # updates leave docs/package.json alone, so a mermaid bump moves apps/web
    # only. The lockfile still resolves docs/; security updates still reach it.
    exclude-paths:
      - "docs/**"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    # majors arrive as individual PRs — leave headroom above the default of 5
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    # let new releases mature before a PR opens; security fixes are never delayed
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    # held back until the ecosystem catches up — drop the entry, don't raise it
    ignore:
      # 0.56 added an `exports` map, so the deep paths y-monaco 0.1.6 imports
      # ("monaco-editor/esm/vs/editor/editor.api.js") no longer resolve and the
      # web build fails. Unblock: a y-monaco release that drops the deep import.
      - dependency-name: "monaco-editor"
        versions: [">=0.56"]
      # typescript-eslint 8.x refuses to load against the TS 7 API, so `pnpm lint`
      # dies before it lints anything. Unblock: typescript-eslint TS >=7 support
      # (typescript-eslint/typescript-eslint#10940).
      - dependency-name: "typescript"
        versions: [">=7"]
      # inferno is not ours to pick: it is the renderer dmn-js's decision table
      # (table-js) draws with, and @designiq/decisions only declares it because the
      # simulation add-on's bundle imports it. Both peer on inferno 5
      # (table-js "^5.0.5", @emaarco/dmn-js-simulation ">=5.6 <6"), so a bump
      # here just puts a SECOND inferno major in the web bundle, rendering the
      # add-on's vnodes into dmn-js's inferno-5 tree. Unblock: dmn-js/table-js
      # moving to inferno 6+ — then this bump follows theirs.
      - dependency-name: "inferno"
        versions: [">=6"]
      # didi is not ours to pick either: it is the one diagram-js depends on
      # ("^11.0.0" in 15.28.1), which apps/web pins and the Miragon renderers
      # take as their peer (#300). A bump on its own leaves diagram-js's
      # injector on didi 11 and the renderers on 12, which
      # apps/web/test/shared-runtimes.test.ts refuses. The entry also holds
      # back the diagram-js group's didi major. Unblock: drop this entry once a
      # diagram-js release depends on didi 12; the diagram-js group then takes
      # that diagram-js major and the didi pin in one PR.
      - dependency-name: "didi"
        versions: [">=12"]
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        exclude-patterns:
          # the BPMN editing engine (ADR 0009) is 0.x: a minor can change the ops,
          # error codes and results agents see — each bump is its own PR
          - "@miragon/bpmn-cli"
          # the Miragon modelers are 0.x too: a minor can change the canvas, its
          # stylesheet or its text lane at runtime, which no CI job renders (#252
          # took a Team Topologies minor in this group). Each family is its own PR
          # (the groups below), reviewed with the canvas open.
          - "@miragon/wardley-*"
          - "@miragon/event-storming-*"
          - "@miragon/context-maps-*"
          - "@miragon/team-topologies-*"
          - "@miragon/value-chain-*"
          - "@miragon/modeler-*"
        update-types: ["minor", "patch"]
      # a renderer and its schema model move together (the renderer pins the
      # schema model exactly; packages/notations pins it as a devDependency to
      # hold the new-file templates to it, and reads a Wardley Map with the
      # renderer's @miragon/wardley-dsl), so one PR per family, its majors
      # included
      miragon-wardley:
        applies-to: version-updates
        patterns: ["@miragon/wardley-*"]
      miragon-event-storming:
        applies-to: version-updates
        patterns: ["@miragon/event-storming-*"]
      miragon-context-maps:
        applies-to: version-updates
        patterns: ["@miragon/context-maps-*"]
      miragon-team-topologies:
        applies-to: version-updates
        patterns: ["@miragon/team-topologies-*"]
      # no value-chain renderer yet, but the validator checks .vc.json files
      # with the schema model (#266): a 0.x minor can change what a save refuses
      miragon-value-chain:
        applies-to: version-updates
        patterns: ["@miragon/value-chain-*"]
      # the contract the renderers implement (@miragon/modeler-api), which
      # apps/web and live-client take directly (#136), and the shell whose
      # view math and keymap apps/web takes (@miragon/modeler-shell, #265).
      # Every renderer pins the contract exactly, so a contract move from this
      # group or a family group alone ships two copies, which
      # apps/web/test/shared-runtimes.test.ts refuses (#300): take it by hand
      # in one PR with every renderer, as #279 and #318 did.
      miragon-modeler:
        applies-to: version-updates
        patterns: ["@miragon/modeler-*"]
      # the Miragon renderers peer on diagram-js, didi and tiny-svg, so apps/web
      # pins all three, didi and tiny-svg at the versions diagram-js depends on;
      # where a pin and diagram-js disagree, the renderers draw with another
      # copy than diagram-js, which apps/web/test/shared-runtimes.test.ts
      # refuses (#300). Their majors share this PR, so a diagram-js major that
      # moves didi or tiny-svg arrives with their pins. Their minors and
      # patches stay in npm-minor-patch: bpmn-js and dmn-js depend on
      # diagram-js and raise its minimum in most releases, so its minors have
      # to move with theirs. A diagram-js major also needs the bpmn-js and
      # dmn-js majors on it, which land as PRs of their own: take them by hand
      # in one PR.
      diagram-js:
        applies-to: version-updates
        patterns: ["diagram-js", "didi", "tiny-svg"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # github-actions — SHA-pinned and CI-gated; majors are mostly mechanical, so
  # group everything. Monthly: workflows change slowly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]

  # docker — base images for the two service Dockerfiles. A node major is a
  # runtime change, so it lands separately (minor+patch grouped).
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/apps/live-host"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      default-days: 5
    groups:
      docker-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]
