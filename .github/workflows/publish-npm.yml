name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - validator
          - mcp
  workflow_call:
    inputs:
      package:
        description: "Package to publish (validator | mcp)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build (tsdown → dist/)
        run: pnpm --filter ./packages/${{ inputs.package }} build
      # designiq-validate as npm installs it (#282): unpacked from the tarball beside only its
      # declared dependencies, started through its shebang. Run with `node` in the workspace, a bin
      # without a shebang or one importing an undeclared or workspace-only package still works, yet
      # breaks once npm installs it. The invalid model proves the CLI can still fail.
      # packages/validator/test/publish-sanity.test.ts runs this step.
      - name: Sanity-run the packed validator bin (the example content repo passes, an invalid model fails)
        if: inputs.package == 'validator'
        run: |
          fail() { echo "::error::$*"; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          modules="$work/node_modules"
          package="$modules/@miragon/design-iq-validator"
          mkdir -p "$work/tarball" "$package" "$modules/.bin"
          pnpm --filter ./packages/validator pack --pack-destination "$work/tarball" > /dev/null
          tar -xzf "$work"/tarball/* -C "$package" --strip-components=1
          for dependency in $(node -p 'Object.keys(require(process.argv[1]).dependencies ?? {}).join(" ")' "$package/package.json"); do
            mkdir -p "$(dirname "$modules/$dependency")"
            ln -s "$PWD/packages/validator/node_modules/$dependency" "$modules/$dependency"
          done
          target="$package/$(node -p 'require(process.argv[1]).bin["designiq-validate"]' "$package/package.json")"
          chmod +x "$target"
          bin="$modules/.bin/designiq-validate"
          ln -s "$target" "$bin"
          invalid=packages/validator/test/fixtures/invalid-content-repo

          status=0
          out="$("$bin" --root process-documentation)" || status=$?
          printf '%s\n' "$out"
          [ "$status" -eq 0 ] || fail "designiq-validate exited $status on the example content repo, expected 0"
          grep -qE '^0 error\(s\), [0-9]+ warning\(s\) .+ OK \(' <<<"$out" || fail "designiq-validate printed no OK summary for the example content repo"

          status=0
          out="$("$bin" --root "$invalid")" || status=$?
          printf '%s\n' "$out"
          [ "$status" -eq 1 ] || fail "designiq-validate exited $status on $invalid, expected 1"
          grep -q '^\[ERROR\] processes/ship-order\.bpmn: ' <<<"$out" || fail "designiq-validate did not report the invalid model of $invalid"
      - name: Sanity-run the built MCP server (must boot, then exit 0 on stdin EOF)
        if: inputs.package == 'mcp'
        run: timeout 30 node packages/mcp/dist/server.js --root process-documentation < /dev/null
      - name: Publish with provenance (skip if version already on the registry)
        run: |
          name="$(node -p "require('./packages/${{ inputs.package }}/package.json').name")"
          version="$(node -p "require('./packages/${{ inputs.package }}/package.json').version")"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version already published — skipping"
          else
            pnpm --filter "$name" publish --access public --no-git-checks --provenance
          fi
