name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pin-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Miragon/pin-npm-dependencies@3f7f02fa2454cdd2cdb65df19b081c0d77d301a5 # v1.2.2

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (eslint — errors fail; warnings are the ratchet)
        run: pnpm lint
      - name: Architecture rules (dependency-cruiser — layer/topology boundaries)
        run: pnpm arch
      - name: Format check (prettier)
        run: pnpm format:check
      - name: Typecheck all packages (type stripping runs untyped otherwise)
        run: pnpm typecheck
      - name: Validate the example content repo (contract-file discovery + BPMN structure/DI)
        run: pnpm validate
      - name: Tests (notations, validator, web sync merge, live-host release flow)
        run: pnpm test
      # The conformance kit of @miragon/modeler-api against the Miragon renderers as
      # designIQ mounts them (#301), in headless Chromium: only for a change that moves a
      # Miragon package (a bump changes its lines in the lockfile), the code that mounts
      # one or a dependency of apps/web, which pins the renderers' peers, the Vite plugins
      # its config loads and the suite's own runner. In this job, so the required check
      # holds it.
      - name: Does the change move a Miragon renderer, the code that mounts one or the suite's runner?
        id: miragon
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mounting=(
            apps/web/src/notations/miragon
            apps/web/src/mcp-app/engines/miragon.ts
            apps/web/src/mcp-app/engines/diagram-js.ts
            apps/web/src/mcp-app/engines/fit.ts
            apps/web/src/mcp-app/core/layout.ts
            apps/web/package.json
            apps/web/vite.config.ts
            apps/web/vitest.browser.config.ts
            apps/web/test/browser
            packages/live-client/src/miragon-sync.ts
            .github/workflows/validate.yml
          )
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- "${mounting[@]}" ||
            git diff "$BASE_SHA" HEAD -- pnpm-lock.yaml ':(glob)**/package.json' | grep -qE '^[-+].*@miragon/(wardley|event-storming|team-topologies|context-maps|value-chain|modeler)-'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Chromium for the conformance kit
        if: steps.miragon.outputs.run == 'true'
        run: pnpm --filter @designiq/web exec playwright install --with-deps --only-shell chromium
      - name: Conformance kit against the Miragon renderers as the SPA and the widget mount them
        if: steps.miragon.outputs.run == 'true'
        run: pnpm --filter @designiq/web test:browser
      - name: Build (web app — a Vite break must not first surface in the Fly image)
        run: pnpm build
      - name: Docker workspace coverage (a missing COPY builds green and dies at boot — #87)
        run: node scripts/check-docker-workspace-coverage.mjs
      - name: No stale pre-monorepo paths in docs or code
        # The b190944 restructure (collab/ → apps/, integrations/ → packages/) left
        # docs pointing at dead paths once — this keeps that class of drift out for good.
        run: |
          if git grep -nE "collab/|integrations/mcp" -- ':!*.lock' ':!node_modules' ':!.github/workflows/validate.yml'; then
            echo "::error::stale pre-monorepo path references found (collab/ or integrations/mcp)"
            exit 1
          fi

  brand:
    name: Brand (docs kit + brand-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Read access to the private Miragon/corporate-identity. Without the secret (not set up
      # yet, or a fork PR) the job warns and skips; the docs workflow still checks the kit
      # against its own manifest.
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the docs kit is not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep ref on the release in docs/.vitepress/miragon/manifest.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.24.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 24

      - name: The docs kit equals its source in the CI
        if: env.CI_SOURCE_TOKEN != ''
        run: node docs/.vitepress/miragon/check.mjs --ci .ci-source

      # Rules and exceptions come from .miragon/brand.json.
      - name: brand-lint (hard rules) on the docs site and the README
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart docs README.md
