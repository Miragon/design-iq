<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>designIQ decision modeler</title>
    <!-- boot config injected by the Live Host when serving the ui:// resource
         (apps/live-host/src/http/mcp.ts replaces the marker) -->
    <script>
      window.DESIGNIQ_BOOT = "__DESIGNIQ_BOOT__";
    </script>
  </head>
  <body>
    <!-- the frameless widget (spec §2): the whole iframe is canvas, the chrome
         floats in the corners. data-icon: a Lucide icon shell.ts prepends at
         boot (mcp-app/icons.ts). Every control starts hidden; the chrome
         reveals it. -->
    <div id="app" data-kind="dmn">
      <div id="canvas"></div>
      <div id="tl" class="corner tl">
        <button
          id="menu-trigger"
          class="fb trigger"
          type="button"
          hidden
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="menu"
          data-icon="menu"
        >
          <span class="sep" aria-hidden="true"></span><span id="doc-name" class="name"></span>
        </button>
        <button
          id="tools"
          class="fb icon"
          type="button"
          hidden
          aria-label="Tools"
          aria-expanded="false"
          title="Tools — the modelling palette"
          data-icon="shapes"
        ></button>
        <!-- the DRD | Table view switch -->
        <span id="mode-slot" class="slot"></span>
      </div>
      <div id="tr" class="corner tr">
        <button
          id="checks-toggle"
          class="fb toggle"
          type="button"
          hidden
          aria-controls="checks"
          aria-expanded="false"
          title="Findings, a scenario and the test cases of this decision"
          data-icon="shield-check"
        >
          <span class="label">Checks</span><span id="checks-verdict" class="verdict" hidden></span>
        </button>
        <button
          id="fullscreen"
          class="fb icon"
          type="button"
          hidden
          aria-label="Open fullscreen"
          title="Open fullscreen"
          data-icon="maximize-2"
        ></button>
        <button
          id="open"
          class="fb primary open"
          type="button"
          hidden
          aria-label="Open in designIQ (new tab)"
          data-icon="external-link"
        >
          <span class="label long">Open in designIQ</span><span class="label short">Open</span>
        </button>
      </div>
      <div id="bl" class="corner bl"><span id="sync" class="sync" hidden></span></div>
      <div id="br" class="corner br">
        <div id="zoom" class="zoom" role="group" aria-label="Zoom" hidden>
          <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out" data-icon="minus"></button>
          <button id="zoom-pct" class="pct" type="button" title="Reset zoom to 100%">100%</button>
          <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in" data-icon="plus"></button>
          <span class="vsep" aria-hidden="true"></span>
          <button
            id="zoom-fit"
            type="button"
            aria-label="Fit diagram (Shift+1)"
            title="Fit diagram (Shift+1)"
            data-icon="scan"
          ></button>
        </div>
      </div>
      <!-- the Checks card: stacked sections in the SPA's Decision-checks order
           (findings, a scenario, the test cases); mcp-app/dmn-checks.ts renders
           each section's row and body -->
      <aside id="checks" class="panel" hidden aria-labelledby="checks-h">
        <div class="panel-head">
          <h2 id="checks-h" tabindex="-1" data-icon="shield-check">Checks</h2>
          <span class="spacer"></span>
          <button
            id="test-run"
            class="pb"
            type="button"
            title="Run every test case against the saved decision"
            data-icon="play"
            data-icon-size="14"
          >
            Run
          </button>
          <button
            id="test-hide"
            class="pb icon ghost"
            type="button"
            title="Close checks (Esc)"
            aria-label="Close checks"
            data-icon="x"
          ></button>
        </div>
        <div class="panel-scroll">
          <section id="checks-findings" class="sect" hidden></section>
          <section id="checks-scenario" class="sect" hidden></section>
          <section id="checks-cases" class="sect"></section>
        </div>
      </aside>
      <div id="lane" class="lane"></div>
      <div id="state" class="state" hidden></div>
      <div id="menu" class="menu" role="menu" aria-labelledby="menu-trigger" hidden></div>
      <div id="sync-popover" class="popover" role="dialog" hidden></div>
      <div id="announce" class="sr-only" aria-live="polite"></div>
      <div id="alert" class="sr-only" role="alert"></div>
    </div>
    <script type="module" src="/src/mcp-app/dmn-main.ts"></script>
  </body>
</html>
