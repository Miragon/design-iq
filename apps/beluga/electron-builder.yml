appId: de.miragon.designiq.beluga
productName: Beluga
directories:
  output: release
files:
  - out/**
  - dist/**
  - resources/icon.png
  - resources/icon-macos.png
  - package.json
# The icon from Miragon's modeler icon set, copied unchanged (png/beluga-1024.png,
# png/beluga-macos-1024.png with the margin of macOS' grid, and ico/beluga.ico).
# The first tool that is not a modeler to carry one: the brand owners took it into
# the set with Miragon/corporate-identity#107.
# the speech engine is a native addon: it cannot be loaded from inside the archive
asarUnpack:
  - "**/node_modules/sherpa-onnx-*/**"
mac:
  target: dir
  icon: resources/icon-macos.png
  category: public.app-category.productivity
  # signed ad hoc for this machine: the bundle gets its own identity
  # (de.miragon.designiq.beluga), which the microphone and system audio
  # permissions are bound to. A build for other Macs needs a Developer ID,
  # notarization and, with the hardened runtime, an entitlements file that
  # grants com.apple.security.device.audio-input
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Beluga transcribes what you say in the meeting. The audio stays on this Mac.
    NSAudioCaptureUsageDescription: Beluga transcribes what the other participants say in the meeting. The audio stays on this Mac.
win:
  target: dir
  icon: resources/icon.ico
linux:
  target: dir
  icon: resources/icon.png
  # the npm name would make it @designiqbeluga
  executableName: beluga
