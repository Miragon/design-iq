# Manual counterpart to the canvas-created todos (the platform files those via
# the API with the anchor block prefilled). The `todo` label is what makes an
# issue a todo; add the `<notation>:<id>` label (e.g. `bpmn:order-to-cash`) so
# it shows up in that model's Todos panel on the canvas.
name: Todo (model work item)
description: File a work item on a model. Anchored todos show up on the designIQ canvas
labels: ["todo"]
body:
  - type: markdown
    attributes:
      value: |
        Todos created **from the designIQ canvas** carry their anchor automatically; this form is the
        manual path. After submitting, also add the `<notation>:<id>` **label** to the issue (e.g.
        `bpmn:order-to-cash`, `wardley:tea-shop`) so the todo appears in that model's panel.
  - type: input
    id: model
    attributes:
      label: Model id
      description: the model's file name without its extension (`order-to-cash` for `order-to-cash.bpmn`)
      placeholder: order-to-cash
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
      placeholder: Clarify whether the credit check can be skipped for existing customers.
    validations:
      required: true
  - type: textarea
    id: anchor
    attributes:
      label: Anchor block (optional, pins the todo to concrete elements of the model)
      description: Adjust the notation, the model id and the elements, and keep the comment markers. The platform parses this block.
      value: |
        <!-- bpmiq:todo v1
        notation: bpmn
        model: order-to-cash
        element: Task_CheckCredit | Check credit
        -->
