packages:
  - "apps/*"
  - "apps/*/ui"
  - "packages/*"
  # the docs site (VitePress), https://miragon.github.io/design-iq/
  - "docs"
  # process-documentation is example CONTENT (designiq.yml + .bpmn), not a package
  # postinstall build scripts pnpm may run (blocked by default for security)
allowBuilds:
  esbuild: true
  inferno: false
minimumReleaseAgeExclude:
  # the Miragon releases with modeler-shell 0.9.0 and contract 1.6
  # (Miragon/modeler-suite#170): published 2026-10-30, adopted on 2026-10-31
  - "@miragon/modeler-api@1.6.0"
  - "@miragon/modeler-shell@0.9.0"
  - "@miragon/wardley-renderer@0.15.0"
  - "@miragon/wardley-dsl@0.8.1"
  - "@miragon/wardley-schema-model@0.6.1"
  - "@miragon/event-storming-renderer@0.9.0"
  - "@miragon/event-storming-dsl@0.3.4"
  - "@miragon/event-storming-schema-model@0.3.1"
  - "@miragon/team-topologies-renderer@0.17.0"
  - "@miragon/team-topologies-schema-model@0.17.0"
  - "@miragon/context-maps-renderer@0.9.0"
  - "@miragon/context-maps-schema-model@0.5.1"
  - "@miragon/context-maps-cml@0.1.8"
  - "@miragon/value-chain-renderer@0.10.0"
  - "@miragon/value-chain-schema-model@0.7.3"
overrides:
  # vitepress 1.6.4 (docs/) is the latest release and still requests vite
  # ^5.4.14, which is stuck below the dev-server fixes; 6.4.5 also closes the
  # advisories up to 6.4.3 (GHSA-rq7h-c2jc-7f22, GHSA-9jrq-w75r-8gcw and the
  # bundled launch-editor ones). Scoped to vitepress, so the vite of apps/web
  # is untouched. The pin comes with the Miragon docs kit
  # (Miragon/corporate-identity, skill docs-site), whose package.json template
  # has it as npm "overrides"; under pnpm it lives here. It changes with a CI
  # release of the kit.
  vitepress>vite: 6.4.5
patchedDependencies:
  # @emaarco/dmn-js-simulation 0.4.0 stopped coercing the value its DRD
  # evaluator hands a decision table to the reading column's typeRef, and
  # reports an unresolved column as undefined instead of null. dmn-js gives
  # every new InputData the type "Any", read as a string, so in a DRD drawn in
  # designIQ a number, boolean or date column would compare that string: in
  # the add-on's Simulate DRD card and in @designiq/decisions (simulate_decision,
  # run_decision_tests, pnpm validate). The patch restores the 0.3 evaluation,
  # two lines in each bundle; the Dockerfiles copy it before their install,
  # and packages/decisions/test/simulate.test.ts and
  # apps/web/test/browser/dmn-simulation.browser.test.ts fail without it.
  # Unblock: an add-on release that coerces by column again drops this entry;
  # until then a new add-on version needs the patch carried forward by hand.
  "@emaarco/dmn-js-simulation@0.4.0": patches/@emaarco__dmn-js-simulation@0.4.0.patch
peerDependencyRules:
  allowedVersions:
    # vitepress-plugin-mermaid 2.0.17 (docs/) is the latest release and still
    # declares mermaid 10 || 11 as its peer, while the docs kit since 1.24.0
    # pins mermaid 12.2.0, which the plugin renders unchanged. The kit's npm
    # template gives the plugin its mermaid through "overrides"; under pnpm
    # this rule keeps `pnpm peers check` clean. It changes with a CI release
    # of the kit.
    vitepress-plugin-mermaid>mermaid: "12"
