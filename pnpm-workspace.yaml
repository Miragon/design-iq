packages:
  - "apps/*"
  - "apps/*/ui"
  - "packages/*"
  # the docs site (VitePress), https://miragon.github.io/design-iq/
  - "docs"
  # process-documentation is example CONTENT (designiq.yml + .bpmn), not a package
  # postinstall build scripts pnpm may run (blocked by default for security)
allowBuilds:
  esbuild: true
  inferno: false
minimumReleaseAgeExclude:
  # the Miragon renderer rollout (modeler-api 1.1, #136): published 2026-10-19/20, adopted 2026-10-20
  - "@miragon/event-storming-renderer@0.3.0"
  - "@miragon/event-storming-dsl@0.3.0"
  - "@miragon/context-maps-renderer@0.3.0"
  - "@miragon/context-maps-schema-model@0.3.0"
  - "@miragon/wardley-renderer@0.8.0"
  - "@miragon/wardley-dsl@0.7.0"
  - "@miragon/team-topologies-renderer@0.11.2"
  - "@miragon/team-topologies-schema-model@0.11.2"
  # the shared modeler contract, an exact dependency of all four renderers
  - "@miragon/modeler-api@1.1.0"
  # the BPMN editing engine (#236) — 0.7.0 published 2026-10-14, adopted the same day (#248)
  - "@miragon/bpmn-cli@0.7.0"
  # its bpmnlint plugin, an exact dependency of 0.7.0 — 0.12.1 published the evening before
  - "@miragon/bpmnlint-plugin-rules@0.12.1"
  # the validator's Value Chain schema check (#266) — 0.5.0 published 2026-10-19, adopted 2026-10-20
  - "@miragon/value-chain-schema-model@0.5.0"
overrides:
  # vitepress 1.6.4 (docs/) is the latest release and still requests vite
  # ^5.4.14, which is stuck below the server.fs.deny bypass fix (>=6.4.3).
  # Scoped to vitepress, so the vite of apps/web is untouched. The pin comes
  # with the Miragon docs kit (Miragon/corporate-identity, skill docs-site),
  # whose package.json template has it as npm "overrides"; under pnpm it
  # lives here. It changes with a CI release of the kit.
  vitepress>vite: 6.4.3
