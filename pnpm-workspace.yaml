packages:
  - "apps/*"
  - "apps/*/ui"
  - "packages/*"
  # the docs site (VitePress), https://miragon.github.io/design-iq/
  - "docs"
  # process-documentation is example CONTENT (designiq.yml + .bpmn), not a package
  # postinstall build scripts pnpm may run (blocked by default for security)
allowBuilds:
  esbuild: true
  inferno: false
minimumReleaseAgeExclude:
  # the Miragon renderers on @miragon/modeler-api 1.2: published 2026-10-21, adopted 2026-10-21
  - "@miragon/modeler-api@1.2.0"
  - "@miragon/wardley-renderer@0.9.0"
  - "@miragon/event-storming-renderer@0.4.0"
  - "@miragon/context-maps-renderer@0.4.0"
  - "@miragon/context-maps-schema-model@0.4.0"
  - "@miragon/team-topologies-renderer@0.12.0"
  - "@miragon/team-topologies-schema-model@0.12.0"
  - "@miragon/value-chain-schema-model@0.6.0"
overrides:
  # vitepress 1.6.4 (docs/) is the latest release and still requests vite
  # ^5.4.14, which is stuck below the server.fs.deny bypass fix (>=6.4.3).
  # Scoped to vitepress, so the vite of apps/web is untouched. The pin comes
  # with the Miragon docs kit (Miragon/corporate-identity, skill docs-site),
  # whose package.json template has it as npm "overrides"; under pnpm it
  # lives here. It changes with a CI release of the kit.
  vitepress>vite: 6.4.3
